---
layout: default
---
<div class="flex three">
{% for demo in site.demos %}
    {% capture category_url %}/categories/{{ demo.category }}{% endcapture %}
    {% if category_url == page.url %}
    <div>
        <!-- 1. ADDED INLINE POSITION RELATIVE BOUNDARY TO THE CARD -->
        <article class="card" style="position: relative !important; overflow: hidden; background: #ffffff;">
        {% if demo.card_picture %}
            {% picture "{{ demo.card_picture }}" 1:1 entropy %}
        {% endif %}
            <!-- UPDATED FOOTER SECTION TO MATCH BUTTON STYLING -->
            <footer style="padding: 0; background: transparent; border: none; margin-top: 8px; text-align: center;">
                <!-- 2. ADDED THE 'stretched-link' CLASS IDENTIFIER HERE -->
                <a href="{{ demo.url | relative_url }}" 
                   class="pseudo button stretched-link" 
                   style="display: block; width: 100%; text-align: center; box-sizing: border-box; margin: 0; font-family: Arial, Helvetica, sans-serif; font-size: 16px !important; font-weight: bold !important; background-color: #ffffff !important; color: #111111 !important; border: 1px solid #aaa !important; border-radius: 4px !important; padding: 8px 12px !important; white-space: normal; line-height: 1.3;">
                    {{ demo.title }}
                </a>
            </footer>
        </article>
    </div>
    {% endif %}
{% endfor %}
</div>
