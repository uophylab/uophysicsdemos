<div class="flex two three-600 four-800">
  {% for demo in site.demos %}
    <!-- Ensure this matches the category check you already use -->
    {% if demo.category == page.title %} 
      <div class="card" style="margin-bottom: 20px;">
        
        <!-- 🔗 LINK STARTS HERE: Wraps both the image and text area -->
        <a href="{{ demo.url | relative_url }}" style="display: block; text-decoration: none; color: inherit;">
          
          <!-- 1. The Image Section -->
          <div class="image-container" style="width: 100%; height: 200px; overflow: hidden; background-color: #ddd;">
            {% if demo.image %}
              <img src="{{ demo.image | relative_url }}" alt="{{ demo.title }}" style="width: 100%; height: 100%; object-fit: cover; transition: transform 0.3s ease;">
            {% else %}
              <!-- Fallback placeholder icon if no image exists for this demo yet -->
              <div style="display: flex; align-items: center; justify-content: center; height: 100%; color: #aaa; font-size: 2em;">🔍</div>
            {% endif %}
          </div>
          
          <!-- 2. The Text/Title Section -->
          <section style="padding: 15px;">
            <h3 style="margin: 0; font-size: 1.1em; color: #111111; font-weight: bold; line-height: 1.4;">
              {{ demo.title }}
            </h3>
          </section>
          
        </a> <!-- 🔗 LINK ENDS HERE -->
        
      </div>
    {% endif %}
  {% endfor %}
</div>
